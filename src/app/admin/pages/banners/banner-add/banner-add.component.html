<div class="flex justify-center">
  <div class="p-6 bg-white rounded shadow max-w-2xl w-full">
    <h2 class="text-xl font-bold mb-4">Thêm Banner</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Tiêu đề -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Tiêu đề <span class="text-red-500">*</span>
        </label>
        <input type="text" formControlName="title"
          class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:ring-blue-300"
          placeholder="Nhập tiêu đề" />
      </div>

      <!-- Ảnh -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Chọn hình ảnh <span class="text-red-500">*</span>
        </label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*"
          class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:ring-blue-300" />

        <!-- Preview -->
        <div *ngIf="previewUrl" class="mt-3">
          <label class="text-sm text-gray-600 block mb-1">Xem trước:</label>
          <img [src]="previewUrl" class="w-full max-h-64 object-contain border rounded shadow" />
        </div>
      </div>

      <!-- Link -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Link chuyển hướng
        </label>
        <input type="text" formControlName="link"
          class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:ring-blue-300"
          placeholder="Link khi click" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Vị trí
        </label>
        <input type="text" formControlName="position"
          class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:ring-blue-300"
          placeholder="Vị trí banner" />
      </div>

      <!-- Nút -->
      <div class="text-right">
        <button type="submit" [disabled]="form.invalid"
          class="w-40 p-2 rounded-full bg-black text-white shadow-lg transition duration-300 cursor-pointer hover:bg-[#707072]">
          Thêm banner
        </button>
      </div>
    </form>
  </div>
</div>
