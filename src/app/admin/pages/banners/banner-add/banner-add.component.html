<div class="max-w-xl mx-auto p-6 bg-white-500 rounded shadow">
  <h2 class="text-2xl font-semibold mb-6 text-blue-600">Thêm Banner</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
    <!-- Tiêu đề -->
    <div>
      <label class="block font-medium text-gray-700 mb-1"
        >Tiêu đề <span class="text-red-500">*</span></label
      >
      <input
        type="text"
        formControlName="title"
        class="w-full border border-gray-300 p-2 rounded"
        placeholder="Nhập tiêu đề"
      />
    </div>

    <!-- Ảnh -->
    <div>
      <label class="block font-medium text-gray-700 mb-1"
        >Chọn hình ảnh <span class="text-red-500">*</span></label
      >
      <input
        type="file"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="block w-full text-center bg-gray-300 text-black font-medium py-2 pl-2 rounded-md shadow hover:bg-gray-400 transition-colors duration-200 cursor-pointer"
      />

      <!-- Preview -->
      <div *ngIf="previewUrl" class="mt-3">
        <label class="text-sm text-gray-600 block mb-1">Xem trước:</label>
        <img
          [src]="previewUrl"
          class="w-full max-h-64 object-contain border rounded shadow"
        />
      </div>
    </div>

    <!-- Link -->
    <div>
      <label class="block font-medium text-gray-700 mb-1"
        >Link chuyển hướng</label
      >
      <input
        type="text"
        formControlName="link"
        class="w-full border border-gray-300 p-2 rounded"
        placeholder="Link khi click"
      />
    </div>

    <!-- Nút -->
    <div class="text-right">
      <button
        type="submit"
        [disabled]="form.invalid"
        class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700 disabled:opacity-50 cursor-pointer"
      >
        Thêm banner
      </button>
    </div>
  </form>
</div>
