<div class="container mx-auto p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">Danh sách banner</h2>
    <div
      class="p-3 bg-sky-400 cursor-pointer flex items-center gap-3 rounded-md"
    >
      <i class="fa-solid fa-plus text-white"></i>
      <button class="btn cursor-pointer font-bold text-white" (click)="onAdd()">
        Thêm banner
      </button>
    </div>
  </div>

  <table class="w-full border border-gray-300">
    <thead>
      <tr class="bg-gray-100">
        <th class="border px-4 py-2">ID</th>
        <th class="border px-4 py-2">Hình ảnh</th>
        <th class="border px-4 py-2">Tiêu đề</th>
        <th class="border px-4 py-2">Vị trí</th>
        <th class="border px-4 py-2">Ngày khởi tạo</th>
        <th class="border px-4 py-2">Ngày kết thúc</th>
        <th class="border px-4 py-2">Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let banner of banners; index as i">
        <td class="border px-4 py-2 text-center">{{ i + 1 }}</td>
        <td class="border px-4 py-2 text-center">
          <img
            [src]="banner.image_url"
            alt="{{ banner.title }}"
            class="w-72 h-auto"
          />
        </td>
        <td class="border px-4 py-2 text-center">{{ banner.title }}</td>
        <td class="border px-4 py-2 text-center">{{ banner.position }}</td>
        <td class="border px-4 py-2">
          {{ banner.start_date | date : "dd/MM/yyyy HH:mm" }}
        </td>
        <td class="border px-4 py-2 text-center">
          {{ banner.end_date | date : "dd/MM/yyyy HH:mm" }}
        </td>
        <td class="border px-4 py-2 text-center">
          <div class="flex justify-center items-center gap-2">
            <button
              (click)="onEdit(banner.id)"
              class="text-white hover:underline cursor-pointer w-12 h-8 bg-blue-500 rounded-md"
            >
              <i class="fa-solid fa-pencil"></i>
            </button>
            <button
              (click)="onDelete(banner.id)"
              class="text-white hover:underline cursor-pointer w-12 h-8 bg-red-500 rounded-md"
            >
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
