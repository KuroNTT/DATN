<div class="flex justify-center">
  <div class="p-6 bg-white rounded shadow max-w-2xl w-full">
    <h2 class="text-xl font-bold mb-4">Sửa Banner</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Tiêu đề -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tiêu đề</label>
        <input
          type="text"
          formControlName="title"
          class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:ring-blue-300"
        />
      </div>

      <!-- Link -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Link (nếu có)</label>
        <input
          type="text"
          formControlName="link"
          class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:ring-blue-300"
        />
      </div>

      <!-- Ảnh hiện tại -->
      <div *ngIf="previewUrl">
        <label class="block text-sm font-medium text-gray-700 mb-1">Ảnh hiện tại</label>
        <img
          [src]="previewUrl"
          alt="Banner preview"
          class="w-72 rounded border shadow"
        />
      </div>

      <!-- Ảnh mới -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Thay ảnh (nếu cần)</label>
        <input
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*"
          class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring focus:ring-blue-300"
        />
      </div>

      <!-- Submit -->
      <div class="text-right">
        <button
          type="submit"
          [disabled]="form.invalid"
          class="w-30 p-2 rounded-full bg-black text-white shadow-lg transition duration-300 cursor-pointer hover:bg-[#707072]"
        >
          Cập nhật
        </button>
      </div>
    </form>
  </div>
</div>
