<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-6 text-center">Sửa Banner</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Tiêu đề -->
    <div class="mb-4">
      <label for="title" class="block font-medium mb-1">Tiêu đề</label>
      <input
        id="title"
        type="text"
        formControlName="title"
        class="w-full border border-gray-300 rounded px-3 py-2"
      />
    </div>

    <!-- Link -->
    <div class="mb-4">
      <label for="link" class="block font-medium mb-1">Link (nếu có)</label>
      <input
        id="link"
        type="text"
        formControlName="link"
        class="w-full border border-gray-300 rounded px-3 py-2"
      />
    </div>

    <!-- Ảnh hiện tại -->
    <div class="mb-4">
      <label class="block font-medium mb-1">Ảnh hiện tại</label>
      <img
        *ngIf="previewUrl"
        [src]="previewUrl"
        alt="Banner preview"
        class="w-72 rounded border"
      />
    </div>

    <!-- Ảnh mới -->
    <div class="mb-4">
      <label for="image" class="block font-medium mb-1"
        >Thay ảnh (nếu cần)</label
      >
      <input
        type="file"
        id="image"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="w-full"
      />
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition cursor-pointer"
    >
      Cập nhật
    </button>
  </form>
</div>
