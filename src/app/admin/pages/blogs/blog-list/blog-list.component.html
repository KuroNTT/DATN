<div class="container mx-auto p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">Danh sách bài viết</h2>
    <a href="/admin/blogs/add">
      <button class="p-5 bg-amber-200 cursor-pointer">Thêm bài viết</button>
    </a>
  </div>

  <table class="w-full border border-gray-300">
    <thead>
      <tr class="bg-gray-100">
        <th class="border px-4 py-2">ID</th>
        <th class="border px-4 py-2">Tiêu đề</th>
        <th class="border px-4 py-2">Tác giả</th>
        <th class="border px-4 py-2">Ngày tạo</th>
        <th class="border px-4 py-2">Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let blog of blogs">
        <td class="border px-4 py-2 text-center">{{ blog.id }}</td>
        <td class="border px-4 py-2">{{ blog.title }}</td>
        <td class="border px-4 py-2 text-center">
          {{ blog.author?.name || "Chưa rõ" }}
        </td>
        <td class="border px-4 py-2 text-center">
          {{ blog.created_at | date : "dd/MM/yyyy" }}
        </td>
        <td class="border text-center justify-center">
          <button
            class="text-white hover:underline mr-3 cursor-pointer w-12 h-8 bg-blue-500 rounded-md"
            (click)="goToEdit(blog.id)"
          >
            <i class="fa-solid fa-pencil"></i>
          </button>
          <button
            class="text-white hover:underline cursor-pointer w-12 h-8 bg-red-500 rounded-md"
          >
            <i class="fa-solid fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
