<form (ngSubmit)="onSubmit()" [formGroup]="form" class="space-y-6">
  <!-- THÔNG TIN SẢN PHẨM -->
  <div class="grid grid-cols-5 gap-4">
    <div>
      <label class="font-medium">Tên sản phẩm</label>
      <input
        formControlName="name"
        placeholder="Tên sản phẩm"
        class="w-full border rounded-lg px-4 py-2"
      />
    </div>
    <div>
      <label class="font-medium">Slug</label>
      <input
        formControlName="slug"
        placeholder="Slug"
        class="w-full border rounded-lg px-4 py-2"
      />
    </div>

    <div>
      <label class="font-medium">Giá gốc</label>
      <input
        formControlName="price"
        type="number"
        placeholder="Giá"
        class="w-full border rounded-lg px-4 py-2"
      />
    </div>
    <div>
      <label class="font-medium">Giá khuyến mãi</label>
      <input
        formControlName="price_sale"
        type="number"
        placeholder="Giá khuyến mãi"
        class="w-full border rounded-lg px-4 py-2"
      />
    </div>

    <div>
      <label class="font-medium">Ảnh đại diện (file)</label>
      <input
        type="file"
        (change)="uploadMainImage($event)"
        class="w-full border rounded-lg px-4 py-2"
      />
    </div>

    <div>
      <label class="font-medium">Xuất xứ</label>
      <input
        formControlName="origin_country"
        placeholder="Xuất xứ"
        class="w-full border rounded-lg px-4 py-2"
      />
    </div>

    <!-- Selects -->
    <div>
      <label class="font-medium">Thương hiệu</label>
      <select
        formControlName="brand_id"
        class="w-full border rounded-lg px-4 py-2"
      >
        <option *ngFor="let b of brands" [value]="b.id">{{ b.name }}</option>
      </select>
    </div>

    <div>
      <label class="font-medium">Danh mục</label>
      <select
        formControlName="category_id"
        class="w-full border rounded-lg px-4 py-2"
      >
        <option *ngFor="let c of categories" [value]="c.id">
          {{ c.name }}
        </option>
      </select>
    </div>

    <div>
      <label class="font-medium">Giới tính</label>
      <select
        formControlName="gender_id"
        class="w-full border rounded-lg px-4 py-2"
      >
        <option *ngFor="let g of genders" [value]="g.id">{{ g.name }}</option>
      </select>
    </div>

    <div>
      <label class="font-medium">Trạng thái</label>
      <select
        formControlName="status"
        class="w-full border rounded-lg px-4 py-2"
      >
        <option [value]="1">Hiển thị</option>
        <option [value]="0">Ẩn</option>
      </select>
    </div>
  </div>
  <div class="col-span-4">
    <label class="font-medium block mb-1">Mô tả sản phẩm</label>
    <textarea
      formControlName="description"
      class="w-full border border-gray-300 rounded-lg px-4 py-2 h-20 resize-none"
      placeholder="Nhập mô tả chi tiết cho sản phẩm"
    ></textarea>
  </div>

  <!-- BIẾN THỂ -->
  <div formArrayName="variants">
    <div
      *ngFor="let variant of variants.controls; let i = index"
      [formGroupName]="i"
      class="border p-4 my-4 rounded-xl bg-gray-50 space-y-3"
    >
      <h4 class="font-bold text-lg">Biến thể {{ i + 1 }}</h4>

      <div class="grid grid-cols-5 gap-4">
        <div>
          <label class="font-medium">Tên màu (VN)</label>
          <input
            formControlName="color_name"
            class="w-full border rounded-lg px-4 py-2"
          />
        </div>
        <div>
          <label class="font-medium">Tên màu gốc (EN)</label>
          <input
            formControlName="original_name"
            class="w-full border rounded-lg px-4 py-2"
          />
        </div>
        <div>
          <label class="font-medium">Chiều cao cổ giày</label>
          <select
            formControlName="shoe_height_id"
            class="w-full border rounded-lg px-4 py-2"
          >
            <option *ngFor="let s of shoeHeights" [value]="s.id">
              {{ s.name }}
            </option>
          </select>
        </div>
        <div>
          <label class="font-medium">Mã sản phẩm (style_code)</label>
          <input
            formControlName="style_code"
            class="w-full border rounded-lg px-4 py-2"
          />
        </div>
      </div>

      <!-- Size và tồn kho -->
      <label class="block font-medium mt-4">Tồn kho theo size</label>
      <div formArrayName="sizes" class="grid grid-cols-6 gap-4">
        <div
          *ngFor="let size of getSizes(i).controls; let j = index"
          [formGroupName]="j"
        >
          <!-- Label size cứng theo tên trong DB -->
          <label class="block text-sm font-semibold mb-1">
            {{ getSizeNameById(size.get("size_id")?.value) || "Size?" }}
          </label>
          <!-- Input stock -->
          <input
            formControlName="stock"
            type="number"
            placeholder="Tồn kho"
            class="w-full border border-gray-300 rounded-md px-3 py-1"
          />
        </div>
      </div>

      <!-- Ảnh chi tiết -->
      <label class="block font-medium mt-4"
        >Ảnh chi tiết biến thể (tối đa 7 ảnh)</label
      >
      <div class="space-y-2">
        <input
          type="file"
          multiple
          accept="image/*"
          (change)="handleDetailImagesUpload($event, i)"
          class="block w-full border border-gray-300 rounded-md px-3 py-2"
        />
      </div>

      <!-- Preview ảnh -->
      <div class="grid grid-cols-7 gap-2 mt-2">
        <img
          *ngFor="let img of previewImages[i]"
          [src]="img"
          class="w-full rounded-lg shadow border"
        />
      </div>

      <button
        type="button"
        (click)="removeVariant(i)"
        class="text-red-600 text-sm mt-2"
      >
        Xoá biến thể
      </button>
    </div>
  </div>

  <!-- BUTTON -->
  <div class="flex justify-between items-center pt-4">
    <button
      type="button"
      (click)="addVariant()"
      class="px-4 py-2 rounded-lg border border-gray-400 text-gray-700 hover:bg-gray-100"
    >
      + Thêm biến thể
    </button>
    <button
      type="submit"
      class="px-6 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700"
    >
      Lưu sản phẩm
    </button>
  </div>
</form>
