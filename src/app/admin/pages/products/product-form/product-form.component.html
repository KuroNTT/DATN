<form (ngSubmit)="onSubmit()" [formGroup]="form" class="space-y-6">
  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="font-medium">Tên sản phẩm</label>
      <input formControlName="name" placeholder="Tên sản phẩm"
        class="w-full border border-gray-300 rounded-lg px-4 py-2" />
    </div>
    <div>
      <label class="font-medium">Slug</label>
      <input formControlName="slug" placeholder="Slug"
        class="w-full border border-gray-300 rounded-lg px-4 py-2" />
    </div>
    <div>
      <label class="font-medium">Giá</label>
      <input formControlName="price" type="number" placeholder="Giá"
        class="w-full border border-gray-300 rounded-lg px-4 py-2" />
    </div>
    <div>
      <label class="font-medium">Giá khuyến mãi</label>
      <input formControlName="price_sale" type="number" placeholder="Giá khuyến mãi"
        class="w-full border border-gray-300 rounded-lg px-4 py-2" />
    </div>
    <div>
      <label class="font-medium">Ảnh đại diện</label>
      <input formControlName="image" placeholder="URL ảnh chính"
        class="w-full border border-gray-300 rounded-lg px-4 py-2" />
    </div>
    <div>
      <label class="font-medium">Xuất xứ</label>
      <input formControlName="origin_country" placeholder="Xuất xứ"
        class="w-full border border-gray-300 rounded-lg px-4 py-2" />
    </div>
  </div>

  <!-- Biến thể -->
  <div formArrayName="variants">
    <div *ngFor="let variant of variants.controls; let i=index" [formGroupName]="i"
      class="border p-4 my-4 rounded-xl bg-gray-50 space-y-3">
      <h4 class="font-bold text-lg mb-2">Biến thể {{ i + 1 }}</h4>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="font-medium">Tên màu (VN)</label>
          <input formControlName="color_name" placeholder="Tên màu tiếng Việt"
            class="w-full border border-gray-300 rounded-lg px-4 py-2" />
        </div>
        <div>
          <label class="font-medium">Tên màu gốc (EN)</label>
          <input formControlName="original_name" placeholder="Tên màu tiếng Anh"
            class="w-full border border-gray-300 rounded-lg px-4 py-2" />
        </div>
        <div>
          <label class="font-medium">Chiều cao cổ giày</label>
          <input formControlName="shoe_height_id" type="number" placeholder="1: Thấp, 2: Vừa, 3: Cao"
            class="w-full border border-gray-300 rounded-lg px-4 py-2" />
        </div>
        <div>
          <label class="font-medium">Mã sản phẩm (style_code)</label>
          <input formControlName="style_code" placeholder="Mã sản phẩm"
            class="w-full border border-gray-300 rounded-lg px-4 py-2" />
        </div>
        <div>
          <label class="font-medium">Ảnh đại diện biến thể</label>
          <input formControlName="image_url" placeholder="URL ảnh biến thể"
            class="w-full border border-gray-300 rounded-lg px-4 py-2" />
        </div>
      </div>

      <!-- Size và tồn kho -->
      <label class="block font-medium mt-4">Size và tồn kho</label>
      <div formArrayName="sizes" class="grid grid-cols-3 gap-2">
        <div *ngFor="let size of getSizes(i).controls; let j=index" [formGroupName]="j">
          <input formControlName="size_id" type="number" placeholder="Size"
            class="w-full border border-gray-300 rounded-lg px-3 py-1 mb-1" />
          <input formControlName="stock" type="number" placeholder="Tồn kho"
            class="w-full border border-gray-300 rounded-lg px-3 py-1" />
        </div>
      </div>

      <!-- Ảnh chi tiết -->
      <label class="block font-medium mt-4">Ảnh chi tiết</label>
      <div formArrayName="images">
        <div *ngFor="let img of getImages(i).controls; let k=index">
          <input [formControlName]="k" placeholder="Ảnh chi tiết {{ k + 1 }}"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-2" />
        </div>
      </div>

      <button type="button" (click)="removeVariant(i)" class="text-red-600 text-sm mt-2">
        ❌ Xoá biến thể
      </button>
    </div>
  </div>

  <button type="button" (click)="addVariant()"
    class="px-4 py-2 rounded-lg border border-gray-400 text-gray-700 hover:bg-gray-100">
    + Thêm biến thể
  </button>
  <button type="submit"
    class="px-6 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700">
    💾 Lưu sản phẩm
  </button>
</form>
