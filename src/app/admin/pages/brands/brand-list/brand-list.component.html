<div class="max-w-8xl">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">Danh sách banner</h2>
    <button
      (click)="onAdd()"
      class="flex items-center px-4 py-1.5 border border-gray-300 rounded-full text-md text-gray-700 hover:bg-black hover:text-white transition cursor-pointer"
    >
      <i class="fa-solid fa-plus mr-2"></i>Thêm thương hiệu
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="table-auto border w-full mt-4">
      <thead>
        <tr>
          <th class="border px-4 py-2">ID</th>
          <th class="border px-4 py-2">Tên</th>
          <th class="border px-4 py-2">Mô tả</th>
          <th class="border px-4 py-2">Trạng thái</th>
          <th class="border px-4 py-2">Hành động</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let brand of brands">
          <td class="border px-4 py-2">{{ brand.id }}</td>
          <td class="border px-4 py-2">{{ brand.name }}</td>
          <td class="border px-4 py-2">{{ brand.description }}</td>
          <td class="px-4 py-2 border">
            {{ brand.status === 1 ? "Hiện" : "Ẩn" }}
          </td>
          <td class="px-4 py-2 border">
            <div class="flex justify-center items-center gap-3">
              <button
                (click)="onEdit(brand.id)"
                class="text-gray-700 hover:text-gray-500 cursor-pointer"
              >
                <i class="fa-solid fa-pencil"></i>
              </button>
              <button
                (click)="onDelete(brand.id)"
                class="text-red-500 hover:text-red-700 cursor-pointer"
              >
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
