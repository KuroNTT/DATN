<div>
  <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-4 gap-3">
    <h2 class="text-xl font-bold">Danh sách danh mục</h2>
    <a
      href="admin/categories/add"
      class="flex items-center px-4 py-1.5 border border-[#c5c5c5] rounded-full text-sm sm:text-md text-gray-700 hover:bg-black hover:text-white transition"
    >
      <i class="fa-solid fa-plus mr-2"></i> Thêm danh mục
    </a>
  </div>

  <div class="bg-gray-100 rounded-md">
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm sm:text-md text-left border border-gray-200">
        <thead class="bg-gray-200 text-center">
          <tr>
            <th class="w-16 px-2 sm:px-4 py-2 border">ID</th>
            <th class="w-40 sm:w-56 px-2 sm:px-4 py-2 border">Tên danh mục</th>
            <th class="w-24 sm:w-32 px-2 sm:px-4 py-2 border">Trạng thái</th>
            <th class="w-20 sm:w-24 px-2 sm:px-4 py-2 border hidden md:table-cell">Thứ tự</th>
            <th class="min-w-[200px] sm:min-w-[300px] px-2 sm:px-4 py-2 border hidden lg:table-cell">Mô tả</th>
            <th class="w-24 sm:w-32 px-2 sm:px-4 py-2 border">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let category of category_arr | paginate: {itemsPerPage: 5, currentPage: p}" class="hover:bg-gray-50">
            <td class="px-2 sm:px-4 py-2 border text-center">{{ category.id }}</td>
            <td class="px-2 sm:px-4 py-2 border">{{ category.name }}</td>
            <td
              class="border px-2 sm:px-4 py-2 text-center font-semibold"
              [ngClass]="{
                'text-green-600 border-black': category.status === 1,
                'text-red-600': category.status === 0
              }"
            >
              {{ category.status === 1 ? "Hiển thị" : "Ẩn" }}
            </td>
            <td class="px-2 sm:px-4 py-2 border text-center hidden md:table-cell">
              {{ category.sort_order }}
            </td>
            <td class="px-2 sm:px-4 py-2 border hidden lg:table-cell truncate max-w-[200px]">
              {{ category.description }}
            </td>
            <td class="px-2 sm:px-4 py-2 border text-center">
              <div class="inline-flex items-center justify-center gap-3">
                <button
                  class="text-gray-700 hover:text-gray-900 cursor-pointer"
                  (click)="goToEdit(category.id)"
                >
                  <i class="fa-solid fa-pencil"></i>
                </button>
                <button
                  class="text-red-500 hover:text-red-700 cursor-pointer"
                  (click)="onDelete(category.id)"
                >
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination giữ nguyên -->
      <pagination-template #pg="paginationApi" (pageChange)="p = $event">
        <div class="flex justify-center items-center mt-6 space-x-2">
          <!-- Nút Trước -->
          <button
            class="w-9 h-9 flex items-center justify-center rounded-full border border-[#c5c5c5] bg-white text-black hover:bg-black hover:text-white transition-shadow duration-200 shadow-sm hover:shadow-md"
            [disabled]="pg.isFirstPage()"
            (click)="pg.previous()"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </button>

          <!-- Số trang -->
          <ng-container *ngFor="let page of pg.pages">
            <button
              class="w-9 h-9 flex items-center justify-center rounded-full border text-sm transition-all duration-200"
              [ngClass]="{
                'bg-black text-white shadow-md': pg.getCurrent() === page.value,
                'bg-white text-black border-[#c5c5c5] hover:bg-[#f3f3f3]': pg.getCurrent() !== page.value
              }"
              (click)="pg.setCurrent(page.value)"
            >
              {{ page.label }}
            </button>
          </ng-container>

          <!-- Nút Sau -->
          <button
            class="w-9 h-9 flex items-center justify-center rounded-full border border-[#c5c5c5] bg-white text-black hover:bg-black hover:text-white transition-shadow duration-200 shadow-sm hover:shadow-md"
            [disabled]="pg.isLastPage()"
            (click)="pg.next()"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </button>
        </div>
      </pagination-template>
    </div>
  </div>
</div>
