<div class="flex justify-center">
  <div class="p-6 bg-white rounded shadow max-w-2xl w-full">
    <h2 class="text-xl font-bold mb-4">Thêm danh mục</h2>
    <form (ngSubmit)="onSubmit()" #categoryForm="ngForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tên danh mục</label>
        <input
          type="text"
          [(ngModel)]="formData.name"
          name="name"
          required
          placeholder="Nhập tên danh mục"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
        <textarea
          [(ngModel)]="formData.description"
          name="description"
          rows="4"
          required
          placeholder="Nhập nội dung mô tả"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"
        ></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Thứ tự hiển thị</label>
        <input
          type="number"
          [(ngModel)]="formData.sort_order"
          name="sort_order"
          required
          placeholder="VD: 1"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
        <select
          [(ngModel)]="formData.status"
          name="status"
          required
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"
        >
          <option [value]="1">Hiển thị</option>
          <option [value]="0">Ẩn</option>
        </select>
      </div>

      <div class="text-right">
        <button
          type="submit"
          [disabled]="categoryForm.invalid"
          class="w-40 p-2 rounded-full bg-black text-white shadow-lg transition duration-300 cursor-pointer hover:bg-[#707072]"
        >
          Thêm danh mục
        </button>
      </div>
    </form>
  </div>
</div>
