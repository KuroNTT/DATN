<div class="container mx-auto p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">Danh sách danh mục bài viết</h2>
    <a
      href="/admin/blog-categories/add"
      class="p-3 bg-sky-400 cursor-pointer flex items-center gap-3 rounded-md"
    >
      <i class="fa-solid fa-plus text-white"></i>
      <button class="cursor-pointer font-bold text-white">
        Thêm danh mục bài viết
      </button>
    </a>
  </div>

  <table class="w-full border border-gray-300">
    <thead class="bg-gray-100">
      <tr>
        <th class="border px-4 py-2 text-center">ID</th>
        <th class="border px-4 py-2">Tên danh mục</th>
        <th class="border px-4 py-2">Mô tả</th>
        <th class="border px-4 py-2">Slug</th>
        <th class="border px-4 py-2 text-center">Thao tác</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cat of categories; index as i">
        <td class="border px-4 py-2 text-center">{{ i + 1 }}</td>
        <td class="border px-4 py-2">{{ cat.name }}</td>
        <td class="border px-4 py-2">{{ cat.description }}</td>
        <td class="border px-4 py-2">{{ cat.slug }}</td>
        <td class="border px-4 py-2 text-center">
          <button
            class="text-white hover:underline mr-3 cursor-pointer w-12 h-8 bg-blue-500 rounded-md"
            (click)="goToEdit(cat.id)"
          >
            <i class="fa-solid fa-pencil"></i>
          </button>
          <button
            class="text-white hover:underline cursor-pointer w-12 h-8 bg-red-500 rounded-md"
            (click)="onDelete(cat.id)"
          >
            <i class="fa-solid fa-trash"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
