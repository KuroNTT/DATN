<div class="container mx-auto p-4">
  <h2 class="text-xl font-bold mb-4">Danh mục bài viết</h2>

  <table class="w-full border border-gray-300">
    <thead class="bg-gray-100">
      <tr>
        <th class="border px-4 py-2 text-center">#</th>
        <th class="border px-4 py-2">Tên danh mục</th>
        <th class="border px-4 py-2">Slug</th>
        <th class="border px-4 py-2 text-center">Thao tác</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cat of categories; index as i">
        <td class="border px-4 py-2 text-center">{{ i + 1 }}</td>
        <td class="border px-4 py-2">{{ cat.name }}</td>
        <td class="border px-4 py-2">{{ cat.slug }}</td>
        <td class="border px-4 py-2 text-center">
          <button class="text-blue-600 hover:underline mr-4">Sửa</button>
          <button class="text-red-600 hover:underline">Xoá</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
