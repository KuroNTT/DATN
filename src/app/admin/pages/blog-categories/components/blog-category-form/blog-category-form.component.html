<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
  <!-- Trường ẩn nếu chỉnh sửa -->
  <input *ngIf="isEditMode" type="hidden" formControlName="id" />

  <!-- Tên danh mục -->
  <div>
    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Tên danh mục</label>
    <input
      id="name"
      type="text"
      formControlName="name"
      placeholder="Nhập tên danh mục"
      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"
    />
    <div
      *ngIf="form.get('name')?.invalid && form.get('name')?.touched"
      class="text-sm text-red-500"
    >
      Tên danh mục là bắt buộc.
    </div>
  </div>

  <!-- Slug -->
  <div>
    <label for="slug" class="block text-sm font-medium text-gray-700 mb-1">Slug</label>
    <input
      id="slug"
      type="text"
      formControlName="slug"
      placeholder="slug-tu-dong"
      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"
    />
    <div
      *ngIf="form.get('slug')?.invalid && form.get('slug')?.touched"
      class="text-sm text-red-500"
    >
      Slug là bắt buộc.
    </div>
  </div>

  <!-- Mô tả -->
  <div>
    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Mô tả</label>
    <textarea
      id="description"
      formControlName="description"
      rows="4"
      placeholder="Nhập mô tả danh mục"
      class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:ring-blue-300"
    ></textarea>
  </div>

  <!-- Nút submit -->
  <div class="text-right">
    <button
      type="submit"
      [disabled]="form.invalid"
      class="w-40 p-2 rounded-full bg-black text-white shadow-lg transition duration-300 cursor-pointer hover:bg-[#707072]"
    >
      {{ isEditMode ? 'Cập nhật danh mục' : 'Thêm danh mục' }}
    </button>
  </div>
</form>
