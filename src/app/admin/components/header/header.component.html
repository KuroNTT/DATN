<header
  class="bg-white shadow-md px-6 h-16 flex items-center justify-between sticky top-0 z-40 rounded-bl-lg flex"
>
  <!-- Logo hoặc Tên Trang -->
  <div class="text-xl font-semibold text-gray-800">Admin Panel</div>
  <div>
    <ul class="flex items-center">
      <!-- Icon user -->
      <li class="relative group user-toggle">
        <a
          (mouseenter)="showUserDropdown()"
          class="hover:text-blue-600 cursor-pointer"
        >
          <i class="fa-solid fa-user"></i>
        </a>

        <!-- Dropdown -->
        <ul
          [ngClass]="{
              'block opacity-100 visible translate-y-0': isUserDropdownVisible,
              'opacity-0 invisible translate-y-[-20px]': !isUserDropdownVisible
            }"
            (mouseleave)="hideUserDropdown()"
            class="hidden group-hover:block lg:absolute lg:top-full lg:right-[-20px] lg:bg-white lg:shadow-lg lg:w-48 z-10 transition-all duration-300 transform user-dropdown" 
        >
          <!-- Chỉ hiển thị nếu đã đăng nhập -->
          <li>
            <span class="block px-4 py-2 text-gray-500">
              Xin chào
              <span class="text-blue-500 uppercase">{{ username }}</span>
            </span>
          </li>

          <!-- Mục dành riêng cho admin -->
          <li *ngIf="isAdmin">
            <a
              (click)="goToHome()"
              class="block px-4 py-2 hover:bg-gray-100 cursor-pointer"
              >Trang sản phẩm</a
            >
          </li>

          <!-- Chung cho mọi user -->
          <li>
            <a
              (click)="goToProfile()"
              class="block px-4 py-2 hover:bg-gray-100 cursor-pointer"
              >Thông tin cá nhân</a
            >
          </li>
          <li>
            <a
              (click)="logout()"
              class="block px-4 py-2 hover:bg-gray-100 cursor-pointer"
              >Đăng xuất</a
            >
          </li>
        </ul>
      </li>
    </ul>
  </div>
</header>
