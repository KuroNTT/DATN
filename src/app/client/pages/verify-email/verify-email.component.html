<div class="max-w-xl mx-auto mt-20 p-4 text-center">
  <h2 class="text-2xl font-bold mb-4">Xác thực tài khoản</h2>

  <p *ngIf="isSuccess" class="text-green-600">{{ message }}</p>
  <p *ngIf="isError" class="text-red-600">{{ message }}</p>

  <a href="/sign-in" *ngIf="isSuccess" class="mt-4 inline-block text-blue-600 underline">
    → Đăng nhập ngay
  </a>
</div>
