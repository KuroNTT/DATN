<h2 class="text-2xl font-bold mb-6 text-gray-800">Thông Tin Cá Nhân</h2>

<form class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <!-- Họ và tên -->
  <div>
    <label class="block text-sm font-medium mb-1 text-gray-700"
      >Họ và tên</label
    >
    <input
      type="text"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Nguyễn Văn A"
    />
  </div>

  <!-- Email -->
  <div>
    <label class="block text-sm font-medium mb-1 text-gray-700">Email</label>
    <input
      type="email"
      disabled
      class="w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500"
      placeholder="example@gmail.com"
    />
  </div>

  <!-- Số điện thoại -->
  <div>
    <label class="block text-sm font-medium mb-1 text-gray-700"
      >Số điện thoại</label
    >
    <input
      type="text"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="0123 456 789"
    />
  </div>

  <!-- Giới tính -->
  <div>
    <label class="block text-sm font-medium mb-1 text-gray-700"
      >Giới tính</label
    >
    <select class="w-full px-4 py-2 border border-gray-300 rounded-lg">
      <option>Nam</option>
      <option>Nữ</option>
      <option>Khác</option>
    </select>
  </div>

  <!-- Địa chỉ -->
  <div class="md:col-span-2">
    <label class="block text-sm font-medium mb-1 text-gray-700">Địa chỉ</label>
    <textarea
      class="w-full px-4 py-2 border border-gray-300 rounded-lg resize-none h-24"
      placeholder="Số nhà, đường, phường, quận/huyện, tỉnh/thành..."
    ></textarea>
  </div>
</form>

<!-- Thông báo xác minh -->
<div class="mt-4 text-red-500 text-sm flex items-center gap-2">
  <i class="fas fa-exclamation-circle"></i>
  Email của bạn chưa được xác minh.
</div>

<!-- Nút lưu -->
<div class="mt-6">
  <button
    type="submit"
    class="w-[150px] p-2 text-sm md:text-lg rounded-full bg-black text-white shadow-lg font-semibold transition duration-300 cursor-pointer hover:bg-[#707072]"
  >
    Lưu thay đổi
  </button>
</div>
