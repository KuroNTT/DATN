<form [formGroup]="form" (ngSubmit)="capNhat()" class="grid grid-cols-1 md:grid-cols-2 gap-3" novalidate>

  <!-- Họ và tên -->
  <div class="min-h-[90px]">
    <label class="block text-sm font-medium mb-1 text-gray-700">Họ và tên</label>
    <input type="text" formControlName="name"
      class="w-full px-4 py-2 border rounded-lg text-sm text-black focus:border-blue-500 outline-none transition-all duration-300"
      [ngClass]="{ 'border-red-500': thong_bao_name, shake: thong_bao_name }"
      placeholder="Nguyễn Văn A" />
    <p *ngIf="thong_bao_name" class="text-red-500 text-sm mt-1">{{ thong_bao_name }}</p>
  </div>

  <!-- Email -->
  <div>
    <label class="block text-sm font-medium mb-1 text-gray-700">Email</label>
    <input type="email" formControlName="email" readonly
      class="w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500"
      placeholder="example@gmail.com" />
  </div>

  <!-- Số điện thoại -->
  <div class="min-h-[90px]">
    <label class="block text-sm font-medium mb-1 text-gray-700">Số điện thoại</label>
    <input type="text" formControlName="phone" (keypress)="chiNhapSo($event)"
      class="w-full px-4 py-2 border rounded-lg text-sm text-black focus:border-blue-500 outline-none transition-all duration-300"
      [ngClass]="{ 'border-red-500': thong_bao_phone, shake: thong_bao_phone }"
      placeholder="0123456789" />
    <p *ngIf="thong_bao_phone" class="text-red-500 text-sm mt-1">{{ thong_bao_phone }}</p>
  </div>

  <!-- Giới tính -->
  <div class="min-h-[90px]">
    <label class="block text-sm font-medium mb-1 text-gray-700">Giới tính</label>
    <select formControlName="sex"
      class="w-full px-4 py-2 border rounded-lg text-sm text-black focus:border-blue-500 outline-none transition-all duration-300"
      [ngClass]="{ 'border-red-500': thong_bao_sex, shake: thong_bao_sex }">
      <option value="">Chọn giới tính</option>
      <option value="male">Nam</option>
      <option value="female">Nữ</option>
      <option value="other">Khác</option>
    </select>
    <p *ngIf="thong_bao_sex" class="text-red-500 text-sm mt-1">{{ thong_bao_sex }}</p>
  </div>

  <!-- Địa chỉ -->
  <div class="md:col-span-2 min-h-[120px]">
    <label class="block text-sm font-medium mb-1 text-gray-700">Địa chỉ</label>
    <textarea formControlName="address"
      class="w-full px-4 py-2 border rounded-lg resize-none h-24 text-sm text-black focus:border-blue-500 outline-none transition-all duration-300"
      [ngClass]="{ 'border-red-500': thong_bao_address, shake: thong_bao_address }"
      placeholder="Số nhà, đường, phường, quận/huyện, tỉnh/thành..."></textarea>
    <p *ngIf="thong_bao_address" class="text-red-500 text-sm mt-1">{{ thong_bao_address }}</p>
  </div>

  <!-- Thông báo xác minh -->
  <div class="text-sm flex items-center gap-2 md:col-span-2"
       [ngClass]="emailVerified ? 'text-green-600' : 'text-red-500'">
    <i class="fas fa-check-circle" *ngIf="emailVerified"></i>
    <i class="fas fa-exclamation-circle" *ngIf="!emailVerified"></i>
    {{ emailVerified ? 'Email của bạn đã được xác minh.' : 'Email của bạn chưa được xác minh.' }}
  </div>

  <!-- Nút lưu -->
  <div class="mt-6 md:col-span-2">
    <button type="submit"
      [disabled]="kiemTraLoi()"
      class="w-[150px] p-2 text-sm md:text-lg rounded-full bg-black text-white shadow-lg font-semibold transition duration-300 cursor-pointer hover:bg-[#707072] disabled:opacity-50 disabled:cursor-not-allowed">
      Lưu thay đổi
    </button>
  </div>
</form>
