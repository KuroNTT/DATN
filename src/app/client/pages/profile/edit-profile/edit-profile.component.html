<form
  [formGroup]="form"
  (ngSubmit)="capNhat()"
  class="grid grid-cols-1 md:grid-cols-2 gap-3"
  novalidate
>
  <!-- Ảnh đại diện -->
  <div class="flex items-center gap-4 mb-4">
    <img
      [src]="avatarPreview || 'images/default-avatar.jpg'"
      alt="Avatar"
      class="w-24 h-24 object-cover rounded-full"
    />

    <input type="file" accept="image/*" (change)="onAvatarSelected($event)" />
  </div>
  <!-- Họ và tên -->
  <div class="min-h-[90px]">
    <label class="block text-sm font-medium mb-1 text-gray-700"
      >Họ và tên</label
    >
    <input
      type="text"
      formControlName="name"
      class="w-full px-4 py-2 border rounded-lg text-sm text-black focus:border-blue-500 outline-none transition"
      [ngClass]="{
        'border-red-500': form.get('name')?.touched && form.get('name')?.invalid
      }"
      placeholder="Nguyễn Văn A"
    />
    <p
      *ngIf="form.get('name')?.touched && form.get('name')?.invalid"
      class="text-red-500 text-sm mt-1"
    >
      Họ tên không được để trống
    </p>
  </div>

  <!-- Email (readonly) -->
  <div class="min-h-[90px]">
    <label class="block text-sm font-medium mb-1 text-gray-700">Email</label>
    <input
      type="email"
      formControlName="email"
      readonly
      class="w-full px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg text-gray-500"
      placeholder="example@gmail.com"
    />
  </div>

  <!-- Số điện thoại -->
  <div class="min-h-[90px]">
    <label class="block text-sm font-medium mb-1 text-gray-700"
      >Số điện thoại</label
    >
    <input
      type="text"
      formControlName="phone"
      (keypress)="chiNhapSo($event)"
      class="w-full px-4 py-2 border rounded-lg text-sm text-black focus:border-blue-500 outline-none transition"
      [ngClass]="{
        'border-red-500':
          form.get('phone')?.touched && form.get('phone')?.invalid
      }"
      placeholder="0123456789"
    />
    <p
      *ngIf="form.get('phone')?.touched && form.get('phone')?.errors?.['required']"
      class="text-red-500 text-sm mt-1"
    >
      Số điện thoại không được để trống
    </p>
    <p
      *ngIf="form.get('phone')?.touched && form.get('phone')?.errors?.['pattern']"
      class="text-red-500 text-sm mt-1"
    >
      Số điện thoại phải gồm đúng 10 chữ số
    </p>
  </div>

  <!-- Giới tính -->
  <div class="min-h-[90px]">
    <label class="block text-sm font-medium mb-1 text-gray-700"
      >Giới tính</label
    >
    <select
      formControlName="sex"
      class="w-full px-4 py-2 border rounded-lg text-sm text-black focus:border-blue-500 outline-none transition"
      [ngClass]="{
        'border-red-500': form.get('sex')?.touched && form.get('sex')?.invalid
      }"
    >
      <option value="">Chọn giới tính</option>
      <option value="male">Nam</option>
      <option value="female">Nữ</option>
      <option value="other">Khác</option>
    </select>
    <p
      *ngIf="form.get('sex')?.touched && form.get('sex')?.invalid"
      class="text-red-500 text-sm mt-1"
    >
      Vui lòng chọn giới tính
    </p>
  </div>

  <!-- Địa chỉ -->
  <div class="md:col-span-2 min-h-[120px]">
    <label class="block text-sm font-medium mb-1 text-gray-700">Địa chỉ</label>
    <textarea
      formControlName="address"
      class="w-full px-4 py-2 border rounded-lg resize-none h-24 text-sm text-black focus:border-blue-500 outline-none transition"
      [ngClass]="{
        'border-red-500':
          form.get('address')?.touched && form.get('address')?.invalid
      }"
      placeholder="Số nhà, đường, phường, quận/huyện, tỉnh/thành..."
    ></textarea>
    <p
      *ngIf="form.get('address')?.touched && form.get('address')?.invalid"
      class="text-red-500 text-sm mt-1"
    >
      Địa chỉ không được để trống hoặc quá ngắn
    </p>
  </div>

  <!-- Thông báo xác minh -->
  <div
    class="text-sm flex items-center gap-2 md:col-span-2"
    [ngClass]="emailVerified ? 'text-green-600' : 'text-red-500'"
  >
    <i class="fas fa-check-circle" *ngIf="emailVerified"></i>
    <i class="fas fa-exclamation-circle" *ngIf="!emailVerified"></i>
    {{
      emailVerified
        ? "Email của bạn đã được xác minh."
        : "Email của bạn chưa được xác minh."
    }}
  </div>

  <!-- Nút lưu -->
  <div class="mt-6 md:col-span-2">
    <button
      type="submit"
      class="w-[150px] p-2 mb-4 text-sm md:text-lg rounded-full bg-black text-white shadow-lg font-semibold transition hover:bg-[#707072]"
    >
      Lưu thay đổi
    </button>
  </div>
</form>
