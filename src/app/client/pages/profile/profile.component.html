<div class="bg-[#f5f5f5] flex justify-center py-[12px] mt-[60px]"> 
  <div class="w-full max-w-[1280px] hidden md:block">
    <a routerLink="/"><span class="text-base font-semibold">Trang chủ</span></a>
    <i class="fa-solid fa-angle-right text-base px-2 text-gray-500"></i>

    <a routerLink="/profile">
      <span class="text-base font-semibold">Thông tin cá nhân</span>
    </a>

    <ng-container *ngIf="breadcrumb">
      <i class="fa-solid fa-angle-right text-base px-2 text-gray-500"></i>
      <a class="cursor-pointer">
        <span class="text-base font-semibold">{{ breadcrumb }}</span>
      </a>
    </ng-container>
  </div>
</div>
<div class="flex w-full max-w-[1280px] my-2 md:my-5 mx-auto min-h-screen">
  <!-- Sidebar -->
  <aside
    class="hidden md:block w-1/4 bg-white rounded-xl shadow-md p-4 mr-6 shadow-[0_0_10px_5px_rgba(0,0,0,0.1)]"
  >
    <app-sidebar></app-sidebar>
  </aside>

  <!-- Main nội dung động -->
  <main
    class="flex-1 bg-white rounded-xl shadow-md px-4 md:p-4 shadow-[0_0_10px_5px_rgba(0,0,0,0.1)]"
  >
    <!-- Nav menu dạng tab cho mobile -->
    <nav
      class="flex md:hidden justify-around border-b mb-4 text-xs font-semibold text-gray-600"
    >
      <a
        routerLink="/profile/edit"
        class="flex flex-col items-center py-2 hover:text-black"
      >
        <i class="fas fa-user text-lg"></i>
        Hồ sơ
      </a>
      <a
        routerLink="/profile/change-pw"
        class="flex flex-col items-center py-2 hover:text-black"
      >
        <i class="fas fa-lock text-lg"></i>
        Mật khẩu
      </a>
      <a
        routerLink="/profile/purchase"
        class="flex flex-col items-center py-2 hover:text-black"
      >
        <i class="fas fa-box-open text-lg"></i>
        Đơn mua
      </a>
      <a
        routerLink="/profile/voucher"
        class="flex flex-col items-center py-2 hover:text-black"
      >
        <i class="fas fa-ticket-alt text-lg"></i>
        Voucher
      </a>
    </nav>

    <router-outlet></router-outlet>
  </main>
</div>
