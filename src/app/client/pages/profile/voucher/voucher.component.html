<h2 class="text-xl font-semibold mb-4">Voucher</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div
      *ngFor="let v of vouchers"
      class="border-2 border-dashed border-blue-500 bg-white p-5 rounded-xl shadow-sm hover:shadow-md transition"
    >
      <!-- Header -->
      <div class="flex justify-between items-center mb-3">
        <span class="font-bold text-lg text-blue-600">{{ v.code }}</span>
        <span class="font-bold text-red-500">
          <ng-container *ngIf="v.discount_type === 'percent'">
            -{{ v.discount_value }}%
          </ng-container>
          <ng-container *ngIf="v.discount_type === 'fixed'">
            -{{ v.discount_value | currency:'VND'}}
          </ng-container>
        </span>
      </div>

      <!-- Body -->
      <p class="text-sm text-gray-700 mb-2">{{ v.description }}</p>
      <p class="text-xs text-gray-500">
        HSD: 
        <span *ngIf="v.end_date !== '0000-00-00'">{{ v.end_date }}</span>
        <span *ngIf="v.end_date === '0000-00-00'">Không giới hạn</span>
      </p>
    </div>
  </div>
