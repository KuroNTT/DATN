<div class="w-full min-h-screen flex items-center justify-center">
  <div
    class="w-[80%] m-3 gap-3 flex flex-col md:flex-row md:justify-center md:items-center"
  >
    <div class="w-full md:w-1/2 h-auto">
      <div>
        <!-- Địa chỉ -->
        <div class="flex items-center mb-2">
          <div class="px-3 py-2 bg-gray-300 border border-black mr-4">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <p class="text-base">
            Tân Chánh Hiệp, Quận 12, Thành phố Hồ Chí Minh
          </p>
        </div>

        <!-- Số điện thoại -->
        <div class="flex items-center mb-2">
          <div class="px-3 py-2 bg-gray-300 border border-black mr-4">
            <i class="fa-solid fa-phone"></i>
          </div>
          <p class="text-base">087-8839-889</p>
        </div>

        <!-- Email -->
        <div class="flex items-center mb-6">
          <div class="px-3 py-2 bg-gray-300 border border-black mr-4">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <p class="text-base">tvm&#64;gmail.com</p>
        </div>

        <hr />
        <h1 class="text-3xl font-bold mt-4 mb-4 text-center lg:text-left">
          Liên hệ với chúng tôi
        </h1>
        <form name="frmdk" class="rounded-lg">
          <!-- Tên đăng ký -->
          <div class="mb-1">
            <input
              type="text"
              name="name"
              class="w-full p-2 mb-2 rounded-xl shadow-md border-1 border-black focus:border-blue-500 outline-none placeholder-gray-400 text-left text-lg"
              placeholder="Tên đăng ký"
            />
          </div>

          <!-- Email -->
          <div class="mb-1">
            <input
              type="email"
              name="email"
              class="email-input w-full p-2 mb-2 rounded-xl shadow-md border-1 border-black focus:border-blue-500 outline-none placeholder-gray-400 text-left text-lg"
              placeholder="Email"
            />
          </div>
          <!-- Nội dung liên hệ -->
          <div class="mb-4">
            <textarea
              name="noi_dung"
              rows="5"
              class="w-full p-2 mb-2 rounded-xl shadow-md border-1 border-black focus:border-blue-500 outline-none placeholder-gray-400 text-left text-lg"
              placeholder="Nội dung"
            ></textarea>
          </div>

          <!-- Nút -->
          <div class="flex justify-end mt-4">
            <button
              type="button"
              class="contact-button w-full px-4 py-3 text-lg rounded-full bg-black text-white shadow-lg lg:w-[40%]"
            >
              GỬI LIÊN HỆ
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="w-full md:w-1/2 h-[600px] rounded-xl overflow-hidden">
      <iframe
        class="w-full h-full"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3918.542469420491!2d106.62525351411647!3d10.846792192268313!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752929a448e109%3A0xb7dc2e39ad2bfeff!2zVHJ1bmcgQ2FvIMSRw6FuZyBGUFQgUG9seXRlY2huaWMgSOG7kyBDaMOtIE1pbmggLSBUaMOhbmggcGjhu5EgVGjhuqFvIEPGoSBN4bqhaQ!5e0!3m2!1svi!2s!4v1718108802847!5m2!1svi!2s"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
  </div>
</div>
