<!-- Breadcrumb -->
<div
  class="breadcrumb flex justify-center py-[12px] mb-[24px] px-4 sm:px-0 bg-[#f5f5f5]"
>
  <div class="w-full max-w-[1280px]">
    <a href=""><span class="text-base font-semibold">Trang chủ</span></a>
    <i
      class="fa-solid fa-angle-right text-base px-2 text-gray-500 text-center"
    ></i>
    <a href="/blog" class="cursor-pointer">
      <span class="text-base font-semibold">Bài viết</span>
    </a>
    <i
      class="fa-solid fa-angle-right text-base px-2 text-gray-500 text-center"
    ></i>
    <a class="cursor-pointer">
      <span class="text-base font-semibold">Chi tiết bài viết</span>
    </a>
  </div>
</div>
<div *ngIf="blog" class="w-full max-w-[1280px] mx-auto p-4 ">
  <!-- Tiêu đề -->
  <h1 class="text-2xl md:text-4xl font-bold text-gray-800 leading-tight">
    {{ blog.title }}
  </h1>

  <!-- Thông tin meta -->
  <div class="flex flex-wrap items-center gap-3 text-sm text-gray-500">
    <p>
      <i class="fa-regular fa-calendar-alt mr-1"></i>
      {{ blog.created_at | date : "longDate" }}
    </p>
    <span *ngIf="blog.author_name">| Tác giả: {{ blog.author_name }}</span>
    <span *ngIf="blog.category?.name"
      >| Chuyên mục: {{ blog.category.name }}</span
    >
    <span *ngIf="blog.view">| Lượt xem: {{ blog.view }}</span>
  </div>

  <!-- Ảnh chính minh họa -->
  <div class="w-full flex justify-center">
    <img
      [src]="blog.thumbnail"
      alt="{{ blog.title }}"
      class="rounded-lg max-h-[480px] object-cover shadow-md"
    />
  </div>

  <!-- Nội dung bài viết -->
  <div
    class="prose prose-lg max-w-none text-gray-800 leading-relaxed"
    [innerHTML]="blog.content"
  ></div>

  <!-- Nút điều hướng -->
  <div class="pt-10">
    <a
     href="/product"
              class="w-[50%] md:w-[30%] p-2 text-sm md:text-lg rounded-full bg-black text-white shadow-lg font-semibold transition duration-300 cursor-pointer hover:bg-[#707072]"
    >
      ← XEM THÊM SẢN PHẨM
    </a>
  </div>
</div>
