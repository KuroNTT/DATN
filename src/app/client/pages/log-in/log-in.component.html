<div class="w-full min-h-screen flex items-center justify-center mt-[20px]">
  <div
    class="w-full max-w-5xl flex flex-col rounded-lg md:flex-row md:gap-0 shadow-[0_0_20px_rgba(0,0,0,0.1)]"
  >
    <div
      class="w-full md:w-1/2 relative order-2 md:order-1 h-[500px] md:h-[600px] rounded-b-lg md:rounded-r-none md:rounded-l-lg overflow-hidden"
    >
      <img
        src="images/colsignup.jpg"
        alt="Background"
        class="absolute inset-0 w-full h-full object-cover opacity-70"
      />
      <div
        class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center text-white text-center px-4"
      >
        <img
          src="images/Logolinewhitebackblack.png"
          alt="Logo TVM"
          class="w-[250px] h-auto object-contain"
        />
        <p class="text-sm md:text-base opacity-90 drop-shadow-sm">
          Chúng tôi không chỉ bán giày <br />
          Chúng tôi mang đến phong cách sống – nơi mỗi bước chân là một tuyên
          ngôn cá tính. Phong cách từ những bước chân đầu tiên .
        </p>
      </div>
    </div>

    <div
      class="w-full md:w-1/2 flex items-center justify-center p-6 md:p-8 order-1 md:order-2"
    >
      <form name="frmdn" class="w-[80%] max-w-md">
        <h1 class="text-3xl font-bold text-center mb-6">Đăng nhập</h1>
        <div class="min-h-[95px]">
          <label class="block mb-1 text-sm text-gray-600">Email</label>
          <input
            type="email"
            name="email"
            class="w-full p-3 rounded-md border text-sm text-black focus:border-blue-500 outline-none transition-all duration-300"
            [ngClass]="{
              'border-red-500': thong_bao_email,
              shake: invalidEmail
            }"
            [(ngModel)]="user.email"
          />
          <p *ngIf="thong_bao_email" class="mt-1 text-red-500 text-sm">
            {{ thong_bao_email }}
          </p>
        </div>
        <div class="min-h-[95px]">
          <label class="block mb-1 text-sm text-gray-600">Mật khẩu</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              class="w-full p-3 rounded-md border text-sm text-black focus:border-blue-500 outline-none transition-all duration-300"
              [ngClass]="{
                'border-red-500': thong_bao_password,
                shake: invalidPassword
              }"
              [(ngModel)]="user.password"
            />

            <button
              type="button"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-black cursor-pointer"
              (click)="togglePassword()"
            >
              <i
                class="fa"
                [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
              ></i>
            </button>
          </div>
          <p *ngIf="thong_bao_password" class="mt-1 text-red-500 text-sm">
            {{ thong_bao_password }}
          </p>
        </div>
        <p class="text-red-500 text-sm mt-2" *ngIf="thong_bao">
          {{ thong_bao }}
        </p>

        <!-- Nút đăng nhập -->
        <div class="flex justify-center">
          <button
            type="button"
            class="w-[50%] p-3 text-sm md:text-lg rounded-full bg-black text-white shadow-lg font-semibold transition duration-300 cursor-pointer hover:bg-[#707072]"
            (click)="dangnhap()"
          >
            ĐĂNG NHẬP
          </button>
        </div>
        <!-- Quên mật khẩu -->
        <div class="text-center mt-4 text-sm text-gray-600">
          Bạn chưa có tài khoản?
          <a href="/sign-up" class="text-red-500 hover:underline ml-1"
            >Đăng ký</a
          >
        </div>
        <div class="text-center text-sm mt-2">
          <a href="/forgot-pw" class="text-gray-500 hover:text-gray-700"
            >Quên mật khẩu?</a
          >
        </div>
      </form>
    </div>
  </div>
</div>
