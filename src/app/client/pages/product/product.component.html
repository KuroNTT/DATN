<div class="container bg-white
">
    <div class="grid grid-cols-1 lg:grid-cols-9 gap-4 mt-[40px]">
        <div class="lg:col-span-2">
            <div class="mt-[35px]">
                <div class="mt-[35px]">
                    <h3 class="text-xl font-bold my-[10px]">Bộ lọc tìm kiếm</h3>
                    <div class="flex items-center justify-between cursor-pointer" (click)="togglePriceFilter()">
                        <h2 class="text-lg font-semibold">Mức giá</h2>
                        <i class="fas fa-chevron-down transition-transform duration-300"
                            [ngClass]="{ 'rotate-180': isPriceFilterVisible }"></i>
                    </div>
                    <div *ngIf="isPriceFilterVisible" class="mt-3 space-y-2">
                        <label class="block"><input type="checkbox" checked /> Tất cả</label>
                        <label class="block"><input type="checkbox" /> Dưới 2 triệu</label>
                        <label class="block"><input type="checkbox" /> Từ 2 - 4 triệu</label>
                        <label class="block"><input type="checkbox" /> Từ 4 - 7 triệu</label>
                        <label class="block"><input type="checkbox" /> Từ 7 - 13 triệu</label>
                    </div>
                    <div class="flex items-center justify-between cursor-pointer mt-4" (click)="toggleBrandFilter()">
                        <h2 class="text-lg font-semibold">Hãng</h2>
                        <i class="fas fa-chevron-down transition-transform duration-300"
                            [ngClass]="{ 'rotate-180': isBrandFilterVisible }"></i>
                    </div>
                    <div *ngIf="isBrandFilterVisible" class="mt-3 space-y-2">
                        <label class="block"><input type="checkbox" checked /> Tất cả</label>
                        <label class="block"><input type="checkbox" /> Nike</label>
                        <label class="block"><input type="checkbox" /> Adidas</label>
                        <label class="block"><input type="checkbox" /> Puma</label>
                    </div>
                    <div class="flex items-center justify-between cursor-pointer mt-4" (click)="toggleSexFilter()">
                        <h2 class="text-lg font-semibold">Loại</h2>
                        <i class="fas fa-chevron-down transition-transform duration-300"
                            [ngClass]="{ 'rotate-180': isSexFilterVisible }"></i>
                    </div>
                    <div *ngIf="isSexFilterVisible" class="mt-3 space-y-2">
                        <label class="block"><input type="checkbox" checked /> Tất cả</label>
                        <label class="block"><input type="checkbox" /> Nam</label>
                        <label class="block"><input type="checkbox" /> Nữ</label>
                    </div>

                </div>
            </div>
        </div>
        <div class="lg:col-span-7">
