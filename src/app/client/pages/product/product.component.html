<div class="breadcrumb flex justify-center py-[12px] mb-[24px] px-4 sm:px-0">
  <div class="container">
    <a href=""><span class="text-base font-semibold">Trang chủ</span></a>
    <i
      class="fa-solid fa-angle-right text-base px-2 text-gray-500 text-center"
    ></i>
    <a class="cursor-pointer"
      ><span class="text-base font-semibold">Sản phẩm</span></a
    >
  </div>
</div>
<div class="flex justify-center px-4 sm:px-0">
  <div class="container">
    <div class="grid grid-cols-1 lg:grid-cols-9 gap-7">
      <!-- Lọc -->
      <div class="lg:col-span-2">
        <h3 class="text-xl font-bold mb-6">Bộ lọc tìm kiếm</h3>
        <div
          class="flex items-center justify-between cursor-pointer mt -6"
          (click)="togglePriceFilter()"
        >
          <h2 class="text-lg font-semibold">Mức giá</h2>
          <i
            class="fas fa-chevron-down transition-transform duration-300"
            [ngClass]="{ 'rotate-180': isPriceFilterVisible }"
          ></i>
        </div>
        <div
          class="overflow-hidden transition-all duration-300"
          [ngClass]="{
            'max-h-0 opacity-0': !isPriceFilterVisible,
            'max-h-96 opacity-100': isPriceFilterVisible
          }"
        >
          <div class="mt-3 space-y-2">
            <label class="block"
              ><input type="checkbox" checked /> Tất cả</label
            >
            <label class="block"><input type="checkbox" /> Dưới 2 triệu</label>
            <label class="block"
              ><input type="checkbox" /> Từ 2 - 4 triệu</label
            >
            <label class="block"
              ><input type="checkbox" /> Từ 4 - 7 triệu</label
            >
            <label class="block"
              ><input type="checkbox" /> Từ 7 - 13 triệu</label
            >
          </div>
        </div>

        <div
          class="flex items-center justify-between cursor-pointer mt-4"
          (click)="toggleBrandFilter()"
        >
          <h2 class="text-lg font-semibold">Hãng</h2>
          <i
            class="fas fa-chevron-down transition-transform duration-300"
            [ngClass]="{ 'rotate-180': isBrandFilterVisible }"
          ></i>
        </div>
        <div
          class="overflow-hidden transition-all duration-300"
          [ngClass]="{
            'max-h-0 opacity-0': !isBrandFilterVisible,
            'max-h-96 opacity-100': isBrandFilterVisible
          }"
        >
          <div class="mt-3 space-y-2">
            <label class="block"
              ><input type="checkbox" checked /> Tất cả</label
            >
            <label class="block"><input type="checkbox" /> Nike</label>
            <label class="block"><input type="checkbox" /> Adidas</label>
            <label class="block"><input type="checkbox" /> Puma</label>
          </div>
        </div>

        <div
          class="flex items-center justify-between cursor-pointer mt-4"
          (click)="toggleSexFilter()"
        >
          <h2 class="text-lg font-semibold">Loại</h2>
          <i
            class="fas fa-chevron-down transition-transform duration-300"
            [ngClass]="{ 'rotate-180': isSexFilterVisible }"
          ></i>
        </div>
        <div
          class="overflow-hidden transition-all duration-300"
          [ngClass]="{
            'max-h-0 opacity-0': !isSexFilterVisible,
            'max-h-96 opacity-100': isSexFilterVisible
          }"
        >
          <div class="mt-3 space-y-2">
            <label class="block"
              ><input type="checkbox" checked /> Tất cả</label
            >
            <label class="block" *ngFor="let category of category_arr"
              ><input type="checkbox" /> {{ category.name }}</label
            >
          </div>
        </div>
      </div>

      <!-- Sản phẩm -->
      <div class="lg:col-span-7">
        <div class="product-related">
          <h3 class="text-xl font-bold">Tất cả sản phẩm</h3>
          <div
            class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 my-6"
          >
            <!-- Product Item -->
            <div class="product" *ngFor="let product of product_arr">
              <div
                class="w-full aspect-square mb-4 overflow-hidden relative group"
              >
                <a href="/product-detail/{{ product.slug }}">
                  <img
                    class="product-image w-full h-full object-cover"
                    src="{{ product.image }}"
                    alt="{{ product.name }}"
                  />
                </a>

                <!-- Icon yêu thích -->
                <div class="product-wish-list">
                  <i
                    [ngClass]="
                      isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'
                    "
                    (click)="toggleLike()"
                  ></i>
                </div>
              </div>

              <!-- Product info -->
              <div class="product-name font-bold text-base mb-2">
                {{ product.name }}
              </div>
              <div class="category-name text-sm text-gray-500 mb-2">
                <span>{{ product.category?.name }}</span>
              </div>
              <div class="product_price text-red-500 font-bold text-base">
                {{ product.price | number : "1.0-0" }}đ
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
