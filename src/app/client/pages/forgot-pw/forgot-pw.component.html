<div class="w-full min-h-screen flex items-center justify-center">
  <div
    class="w-full md:h-[600px] max-w-5xl flex flex-col md:flex-row rounded-lg md:rounded-md overflow-hidden md:gap-0 shadow-[0_0_20px_rgba(0,0,0,0.1)]"
  >
    <!-- Form bên trái -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-6">
      <form name="frmQuenMk" class="w-[80%] max-w-md">
        <h1 class="text-3xl font-bold text-center mb-6">Quên mật khẩu</h1>

        <!-- Email -->
        <div class="min-h-[95px]">
          <label class="block mb-1 text-sm text-gray-600">Email</label>
          <input
            type="email"
            name="email"
            class="w-full p-3 rounded-xl border text-sm text-black focus:border-blue-500 outline-none transition-all duration-300"
            [ngClass]="{
              'border-red-500': thong_bao_email,
              shake: invalidEmail
            }"
            [(ngModel)]="email"
          />
          <p *ngIf="thong_bao_email" class="mt-1 text-red-500 text-sm">
            {{ thong_bao_email }}
          </p>
        </div>

        <!-- Thông báo -->
        <p
          class="text-sm mt-2 text-center"
          [class.text-red-500]="isError"
          [class.text-green-500]="!isError && thong_bao"
        >
          {{ thong_bao }}
        </p>

        <!-- Nút gửi -->
        <div class="flex justify-center mt-4">
          <button
            type="button"
            class="w-[50%] p-3 text-sm md:text-lg rounded-full bg-black text-white shadow-lg font-semibold transition duration-300 cursor-pointer hover:bg-[#707072]"
            (click)="submit()"
          >
            Gửi liên kết
          </button>
        </div>

        <!-- Link quay lại đăng nhập -->
        <div class="text-center mt-4 text-sm text-gray-600">
          Quay lại
          <a href="/sign-in" class="text-red-500 hover:underline ml-1"
            >Đăng nhập</a
          >
        </div>
      </form>
    </div>

    <!-- Hình ảnh bên phải -->
    <div
      class="w-full md:w-1/2 relative order-2 md:order-1 min-h-[600px] md:min-h-[600px] rounded-b-lg md:rounded-r-lg overflow-hidden"
    >
      <img
        src="images/colforgetpw.png"
        alt="Background"
        class="absolute inset-0 w-full h-full object-cover opacity-70"
      />
      <div
        class="absolute inset-0 bg-black/60 flex flex-col items-center justify-center text-white text-center px-4"
      >
        <img
          src="images/Logolinewhitebackblack.png"
          alt="Logo TVM"
          class="w-[250px] h-auto object-contain mb-4"
        />
        <p class="text-sm md:text-base opacity-90 drop-shadow-sm">
          Chúng tôi không chỉ bán giày <br />
          Chúng tôi mang đến phong cách sống – nơi mỗi bước chân là một tuyên
          ngôn cá tính. Phong cách từ những bước chân đầu tiên .
        </p>
      </div>
    </div>
  </div>
</div>
