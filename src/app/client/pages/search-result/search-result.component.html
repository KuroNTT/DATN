<div
  class="breadcrumb flex justify-center py-[12px] mb-[24px] px-4 sm:px-0 mt-[60px]"
>
  <div class="container">
    <a href=""><span class="text-base font-semibold">Trang chủ</span></a>
    <i
      class="fa-solid fa-angle-right text-base px-2 text-gray-500 text-center"
    ></i>
    <a class="cursor-pointer"
      ><span class="text-base font-semibold">Sản phẩm</span></a
    >
  </div>
</div>
<div class="flex justify-center px-4 sm:px-0">
  <div class="container">
    <div class="grid grid-cols-1 lg:grid-cols-9 gap-7">
      <!-- Lọc -->
      <div class="lg:col-span-2">
        <h3 class="text-xl font-bold m4-6">Kết quả tìm kiếm cho</h3>
        <h3 class="text-xl font-semibold mb-6">({{ searchQuery }})</h3>
        <div class="sticky top-6">
          <app-product-filter
            (filterChanged)="onFilterChanged($event)"
          ></app-product-filter>
        </div>
      </div>

      <!-- Sản phẩm -->
      <div class="lg:col-span-7">
        <div class="product-related">
          <h3 class="text-xl font-bold">Tất cả sản phẩm</h3>
          <div
            class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 my-6"
          >
            <!-- Product Item -->
            <div class="product" *ngFor="let product of product_arr">
              <div
                class="w-full aspect-square mb-4 overflow-hidden relative group"
              >
                <a [routerLink]="['/product-detail', product.slug]">
                  <img
                    class="product-image w-full h-full object-cover"
                    [src]="product.image"
                    alt="{{ product.name }}"
                  />
                </a>
              </div>

              <!-- Product info -->
              <div class="product-name font-bold text-base mb-2">
                {{ product.name }}
              </div>
              <div class="category-name text-sm text-gray-500 mb-2">
                <span>{{ product.category?.name }}</span>
              </div>
              <div class="product_price text-red-500 font-bold text-base">
                {{ product.price_sale | number : "1.0-0" }}đ
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
