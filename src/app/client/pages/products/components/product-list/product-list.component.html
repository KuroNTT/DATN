<div class="product-related">
    <h3 class="text-xl font-bold">Tất cả sản phẩm</h3>
    <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 my-6">
        <!-- Product Item -->
        <div class="product" *ngFor="let product of products">
            <div class="w-full aspect-square mb-4 overflow-hidden relative group">
                <a href="/product-detail/{{ product.slug }}">
                    <img class="product-image w-full h-full object-cover" src="{{ product.image }}"
                        alt="{{ product.name }}" />
                </a>

                <!-- Overlay hiển thị khi hover -->
                <div
                    class="absolute bottom-0 left-0 w-full h-1/5 bg-black/40 flex items-center justify-center opacity-0 translate-y-full group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300">
                    <i class="fa-solid fa-cart-plus text-white text-2xl cursor-pointer hover:text-yellow-400"></i>
                </div>

                <!-- Icon yêu thích -->
                <div class="product-wish-list">
                    <i [ngClass]="
                  isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'
                " (click)="toggleLike()"></i>
                </div>
            </div>

            <!-- Product info -->
            <div class="product-name font-bold text-base mb-2">
                {{ product.name }}
            </div>
            <div class="category-name text-sm text-gray-500 mb-2">
                <span>Giày nam</span>
            </div>
            <div class="product_price text-red-500 font-bold text-base">
                {{ product.price_sale | number : "1.0-0" }}đ
            </div>
        </div>
    </div>
</div>
