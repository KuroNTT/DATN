<div
  class="breadcrumb flex justify-center py-[12px] mb-[24px] mt-[60px] px-4 sm:px-0"
>
  <div class="container">
    <a href=""><span class="text-base font-semibold">Trang chủ</span></a>
    <i
      class="fa-solid fa-angle-right text-base px-2 text-gray-500 text-center"
    ></i>
    <a class="cursor-pointer"
      ><span class="text-base font-semibold">Sản phẩm</span></a
    >
  </div>
</div>

<div class="flex justify-center px-4 sm:px-0">
  <div class="container">
    <div class="grid grid-cols-1 lg:grid-cols-9 gap-7">
      <!-- Lọc -->
      <div class="lg:col-span-2">
        <div class="sticky top-6">
          <app-product-filter
            (filterChanged)="onFilterChanged($event)"
          ></app-product-filter>
        </div>
      </div>

      <!-- Sản phẩm -->
      <div class="lg:col-span-7">
        <app-product-list
          [products]="product_arr"
          [currentPage]="p"
          ngSkipHydration
        ></app-product-list>
      </div>
    </div>
    <!-- Phân trang -->
    <div class="flex justify-center m-6">
      <pagination-template
        #pg="paginationApi"
        id="product_pagination"
        (pageChange)="p = $event"
        
      >
        <div class="flex justify-center items-center space-x-2">
          <!-- Nút Trước -->
          <button
            class="w-9 h-9 flex items-center justify-center rounded-full border border-[#c5c5c5] bg-white text-black hover:bg-black hover:text-white transition-shadow duration-200 shadow-sm hover:shadow-md"
            [disabled]="pg.isFirstPage()"
            (click)="pg.previous()"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>

          <!-- Số trang -->
          <ng-container *ngFor="let page of pg.pages">
            <button
              class="w-9 h-9 flex items-center justify-center rounded-full border text-sm transition-all duration-200"
              [ngClass]="{
                'bg-black text-white shadow-md': pg.getCurrent() === page.value,
                'bg-white text-black border-[#c5c5c5] hover:bg-[#f3f3f3]':
                  pg.getCurrent() !== page.value
              }"
              (click)="pg.setCurrent(page.value)"
            >
              {{ page.label }}
            </button>
          </ng-container>

          <!-- Nút Sau -->
          <button
            class="w-9 h-9 flex items-center justify-center rounded-full border border-[#c5c5c5] bg-white text-black hover:bg-black hover:text-white transition-shadow duration-200 shadow-sm hover:shadow-md"
            [disabled]="pg.isLastPage()"
            (click)="pg.next()"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>
      </pagination-template>
    </div>
  </div>
</div>
